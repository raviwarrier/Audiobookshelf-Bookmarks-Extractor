version: '3.8'

services:
  abs-snippet-sidecar:
    build: .
    container_name: abs-snippet-sidecar
    restart: unless-stopped
    environment:
      - ABS_SERVER_URL=http://audiobookshelf:80
      - VOLUME_DIR=/data
      - WHISPER_MODEL=base.en
      - WHISPER_DEVICE=cpu
      - VOSK_MODEL_NAME=vosk-model-small-en-us-0.15
    volumes:
      # Read-only mount of audiobooks library
      - /path/to/your/audiobooks:/audiobooks:ro
      # Output snippet mount
      - ./bookmarks:/data
    ports:
      - "13379:13379"
